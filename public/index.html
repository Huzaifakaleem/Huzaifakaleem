<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ─── Primary SEO ─── -->
    <title>Huzaifa Kaleem — MERN Stack Developer | Full Stack Engineer</title>
    <meta name="description" content="Huzaifa Kaleem is a MERN Stack Developer specializing in building scalable, high-performance web applications using MongoDB, Express.js, React, and Node.js." />
    <meta name="keywords" content="Huzaifa Kaleem, MERN Stack Developer, Full Stack Engineer, React Developer, Node.js Developer, MongoDB, Express.js, JavaScript Developer, Web Developer Pakistan, Portfolio" />
    <meta name="author" content="Huzaifa Kaleem" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://huzaifakaleem.site/" />

    <!-- ─── Theme & Browser UI ─── -->
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="color-scheme" content="dark" />
    <meta name="msapplication-TileColor" content="#0a0e1a" />

    <!-- ─── Open Graph (Facebook / LinkedIn / WhatsApp) ─── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://huzaifakaleem.site/" />
    <meta property="og:title" content="Huzaifa Kaleem — MERN Stack Developer" />
    <meta property="og:description" content="Building scalable, high-performance full-stack web applications with MongoDB, Express.js, React, and Node.js." />
    <meta property="og:image" content="https://huzaifakaleem.site/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Huzaifa Kaleem — MERN Stack Developer Portfolio" />
    <meta property="og:site_name" content="Huzaifa Kaleem Portfolio" />
    <meta property="og:locale" content="en_US" />

    <!-- ─── Twitter / X Card ─── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://huzaifakaleem.site/" />
    <meta name="twitter:title" content="Huzaifa Kaleem — MERN Stack Developer" />
    <meta name="twitter:description" content="Building scalable, high-performance full-stack web applications with MongoDB, Express.js, React, and Node.js." />
    <meta name="twitter:image" content="https://huzaifakaleem.site/images/og-image.png" />
    <meta name="twitter:image:alt" content="Huzaifa Kaleem — MERN Stack Developer Portfolio" />
    <meta name="twitter:creator" content="@huzaifakaleem" />
    <meta name="twitter:site" content="@huzaifakaleem" />

    <!-- ─── Structured Data (JSON-LD) ─── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Huzaifa Kaleem",
      "url": "https://huzaifakaleem.site/",
      "image": "https://huzaifakaleem.site/images/og-image.png",
      "jobTitle": "MERN Stack Developer",
      "description": "Full Stack Web Developer specializing in MongoDB, Express.js, React, and Node.js.",
      "knowsAbout": ["JavaScript", "React", "Node.js", "MongoDB", "Express.js", "Full Stack Development", "Web Development"],
      "sameAs": [
        "https://github.com/huzaifakaleem",
        "https://linkedin.com/in/huzaifakaleem"
      ],
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "https://huzaifakaleem.site/"
      }
    }
    </script>

    <!-- ─── Favicons & PWA ─── -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/images/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ─── Performance: Preconnect ─── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Syne + Inter + JetBrains Mono -->
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet" />

    <style>
      /* Prevent flash of unstyled content */
      html {
        background-color: #0a0e1a;
      }

      /* Skip link */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #00d4ff;
        color: #000;
        padding: 8px 16px;
        z-index: 10000;
        font-family: monospace;
        font-size: 14px;
        border-radius: 0 0 8px 0;
        transition: top 0.2s;
      }

      .skip-link:focus {
        top: 0;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <form name="contact" netlify hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>

    <script src="https://kit.fontawesome.com/c65c7310d7.js" crossorigin="anonymous"></script>
  </body>
</html>
